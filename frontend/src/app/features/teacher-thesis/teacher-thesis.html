<p-toast />
<p-confirmdialog />

<div class="teacher-thesis-page">
  <div class="page-header">
    <h1>Advisor requests</h1>

    <p>Review students who asked you to be their thesis advisor.</p>
  </div>

  <p-table
    [value]="requests()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    dataKey="id"
  >
    <ng-template #header>
      <tr>
        <th>Student</th>
        <th>Message</th>
        <th>Status</th>
        <th class="actions-column">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-request>
      <tr>
        <td>{{ studentName(request.studentId) }}</td>

        <td class="message-cell">
          {{ request.message || '—' }}
        </td>

        <td>
          <p-tag
            [value]="getStatusLabel(request.status)"
            [severity]="getStatusSeverity(request.status)"
          />
        </td>

        <td class="actions-column">
          @if (request.status === 'PENDING') {
            <div class="row-actions">
              <p-button
                label="Approve"
                icon="pi pi-check"
                severity="success"
                [loading]="processingId() === request.id"
                (onClick)="confirmApprove(request)"
              />

              <p-button
                label="Reject"
                icon="pi pi-times"
                severity="danger"
                [outlined]="true"
                [loading]="processingId() === request.id"
                (onClick)="confirmReject(request)"
              />
            </div>
          } @else {
            <span class="no-actions">—</span>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No advisor requests yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
