<div class="app-layout">

  <header class="app-header">
    <div class="header-left">
      <i class="pi pi-bars menu-icon" (click)="toggleSidebar()"></i>
    </div>

    <div class="app-logo">
      Academic<span>Info</span>
    </div>

    <div class="user-area">
      <span class="user-name">USER</span>

      <div class="sign-out">
        <i class="pi pi-sign-out"></i>
        <span>Sign Out</span>
      </div>
    </div>
  </header>

  <div class="app-body">

    <aside class="sidebar" [class.closed]="!sidebarOpen()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <i class="pi pi-home"></i>
        <span>Home</span>
      </a>

      <a routerLink="/student/courses" routerLinkActive="active">
        <i class="pi pi-book"></i>
        <span>Courses</span>
      </a>

      <a routerLink="/teachers" routerLinkActive="active">
        <i class="pi pi-users"></i>
        <span>Teachers</span>
      </a>
    </aside>

    <div class="main-area">

      <main class="content">
        <router-outlet />
      </main>

      <footer class="app-footer">
        <app-about />
      </footer>

    </div>

  </div>

</div>
