      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:h2:file:./data/integra_db
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

