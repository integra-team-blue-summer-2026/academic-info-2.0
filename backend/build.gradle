plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springdoc.openapi-gradle-plugin' version '1.8.0'
    id 'org.openapi.generator' version '7.4.0'
}

group = 'cloudflight.integra'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

test {
    useJUnitPlatform {
        if (project.hasProperty('excludeTags')) {
            excludeTags project.property('excludeTags').split(',')
        }
    }
}

openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs.yaml")
    outputDir.set(layout.buildDirectory.dir("openapi"))
    outputFileName.set("openapi.yaml")
}

openApiGenerate {
    generatorName.set("typescript-angular")
    inputSpec.set(layout.buildDirectory.file("openapi/openapi.yaml").get().asFile.absolutePath.replace('\\', '/'))

    outputDir.set("$projectDir/../frontend/src/app/core/api")

    apiPackage.set("services")
    modelPackage.set("models")
}

tasks.matching { it.name == 'forkedSpringBootRun' }.configureEach {
    dependsOn tasks.named('bootJar')
    dependsOn tasks.named('jar')
    mustRunAfter tasks.named('compileTestJava')
    mustRunAfter tasks.named('test')
    mustRunAfter tasks.named('processTestResources')

    doNotTrackState("")
}

tasks.named("openApiGenerate") {
    dependsOn tasks.named("generateOpenApiDocs")
}

tasks.named("build") {
    dependsOn tasks.named("openApiGenerate")
}
